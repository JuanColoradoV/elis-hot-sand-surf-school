name: Deploy to Cloudflare Pages

# Every push to main auto-deploys the site/ folder to the Cloudflare Pages
# project "elis-hot-sand" (https://elis-hot-sand.pages.dev). This replaces the
# old GitHub Pages deploy so there is a single canonical live copy.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN  — create at Cloudflare dashboard → My Profile →
#     API Tokens → Create Token → "Edit Cloudflare Pages" template.
# The account ID below is not sensitive (it appears in dashboard URLs).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7b110f9f7574885e563f1be79a9abc55
          command: pages deploy site --project-name=elis-hot-sand --branch=main
